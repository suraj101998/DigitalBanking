# application-test.properties — INTEGRATION TEST PROFILE (doc item #60)
# Activated automatically by @SpringBootTest when profile = "test"

# Use H2 in-memory for unit tests — use Testcontainers for integration tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Suppress noisy test output
logging.level.org.hibernate.SQL=WARN
logging.level.com.example.pi=INFO

jwt.secret=test-secret-key-for-unit-tests-only-not-production-123456789
jwt.expiration=3600000

# Unlimited amounts for test scenarios
banking.transaction.max-single-amount=999999999.00
banking.transaction.daily-limit=999999999.00
banking.transaction.monthly-limit=999999999.00
