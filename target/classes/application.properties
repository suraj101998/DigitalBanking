spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/digitalbanking
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.naming-strategy=org.hibernate.cfg.ImprovedNamingStrategy
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.data.web.pageable.default-page-size=5
spring.data.web.pageable.one-indexed-parameters=false

spring.cache.type=simple
spring.cache.cache-names=Customer,Transactions,AllTransactions,LatestTransactions,Balance,TransactionsByMode


jwt.secret=mySecretKeyForJwtTokenGenerationAndValidationPleaseKeepItSafeAndSecure12345
jwt.expiration=3600000

# ==================== LOGGING CONFIGURATION ====================

# Logging Level Configuration
logging.level.root=INFO
logging.level.com.example.pi=DEBUG
logging.level.com.example.pi.controller=DEBUG
logging.level.com.example.pi.service=DEBUG
logging.level.com.example.pi.repository=DEBUG
logging.level.com.example.pi.security=DEBUG
logging.level.com.example.pi.exception=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Logback Configuration File
logging.config=classpath:logback-spring.xml

# File Logging
logging.file.name=./logs/trace_log.log
logging.file.max-size=10MB
logging.file.max-history=30

# Console Output
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Tomcat Access Logs (Detailed)
server.tomcat.accesslog.enabled=true
server.tomcat.basedir=tomcat
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.file-date-format=.yyyy-MM-dd
server.tomcat.accesslog.directory=./logs
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b "%{Referer}i" "%{User-Agent}i" %D
