# ==================== DATASOURCE ====================
# Use environment variables — never commit real credentials (doc item #58)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/digitalbanking}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== JPA / HIBERNATE ====================
# Flyway owns schema creation; Hibernate must NOT alter the schema (doc item #15)
# Use 'validate' in non-local environments — kept as 'update' here only for initial local dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ==================== FLYWAY ====================
# Enable Flyway for all non-local environments (doc item #15).
# Set DB_FLYWAY_ENABLED=true when you want Flyway to manage the schema.
spring.flyway.enabled=${DB_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ==================== CONNECTION POOL (HikariCP) ====================
# Tune based on measured workload (doc item #60)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=DigitalBankingPool

# ==================== PAGINATION ====================
spring.data.web.pageable.default-page-size=5
spring.data.web.pageable.one-indexed-parameters=false

# ==================== CACHE ====================
# NOTE: 'simple' does NOT scale across multiple instances — use Redis for multi-instance (doc item #36)
spring.cache.type=simple
spring.cache.cache-names=Customer,Transactions,AllTransactions,LatestTransactions,Balance,TransactionsByMode

# ==================== JWT ====================
# WARNING: set JWT_SECRET env var before pushing to any shared/public environment (doc items #10, #30)
# The value below is the LOCAL development fallback only — never use it in production
jwt.secret=${JWT_SECRET:mySecretKeyForJwtTokenGenerationAndValidationPleaseKeepItSafeAndSecure12345}
jwt.expiration=3600000
jwt.issuer=digital-banking-api
jwt.audience=digital-banking-clients
# Refresh token: 7 days (doc item #67)
jwt.refresh-expiration=604800000

# ==================== TRANSACTION LIMITS (doc item #63) ====================
banking.transaction.max-single-amount=500000.00
banking.transaction.daily-limit=1000000.00
banking.transaction.monthly-limit=5000000.00

# ==================== ACTUATOR ====================
# Only expose safe endpoints — others require ADMIN role (doc item #50)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator
management.info.env.enabled=true

# ==================== LOGGING ====================
logging.level.root=INFO
logging.level.com.example.pi=DEBUG
logging.level.com.example.pi.controller=DEBUG
logging.level.com.example.pi.service=DEBUG
logging.level.com.example.pi.repository=DEBUG
logging.level.com.example.pi.security=DEBUG
logging.level.com.example.pi.exception=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

logging.config=classpath:logback-spring.xml
logging.file.name=./logs/trace_log.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n

# ==================== TOMCAT ACCESS LOGS ====================
server.tomcat.accesslog.enabled=true
server.tomcat.basedir=tomcat
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.file-date-format=.yyyy-MM-dd
server.tomcat.accesslog.directory=./logs
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b "%{Referer}i" "%{User-Agent}i" %D
