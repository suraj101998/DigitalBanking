# application-dev.properties — LOCAL DEVELOPMENT PROFILE (doc item #60)
# Activate with: spring.profiles.active=dev  OR  SPRING_PROFILES_ACTIVE=dev

# Verbose SQL logging in dev
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.example.pi=DEBUG

# Hibernate can create/update schema locally — never in prod
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

# JWT secret for local testing only (NOT a real secret)
jwt.secret=dev-local-only-secret-key-not-for-production-use-at-all-123456

# Small transaction limits for easier testing
banking.transaction.max-single-amount=10000.00
banking.transaction.daily-limit=50000.00
banking.transaction.monthly-limit=200000.00
