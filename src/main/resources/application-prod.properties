# application-prod.properties — PRODUCTION PROFILE (doc item #60)
# Activate with: SPRING_PROFILES_ACTIVE=prod
# ALL sensitive values MUST come from environment variables or Vault

# Flyway owns the schema in production — Hibernate must not touch it
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Require all secrets from environment — no fallback defaults
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}

# Minimal logging in production
logging.level.root=WARN
logging.level.com.example.pi=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Tight transaction limits in production
banking.transaction.max-single-amount=${TX_MAX_SINGLE:500000.00}
banking.transaction.daily-limit=${TX_DAILY_LIMIT:1000000.00}
banking.transaction.monthly-limit=${TX_MONTHLY_LIMIT:5000000.00}
